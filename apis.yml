name: Root (fka Slim.ai)
description: >-
  Root (formerly Slim.ai) is a container and dependency security company backed by Insight Partners.
  Its "secure supply" platform delivers end-to-end, autonomous vulnerability remediation for container
  images and application packages: a fleet of AI agents (Agentic Vulnerability Remediation, AVR)
  researches, patches, tests, and ships Root Patches within minutes of CVE publication, without base-image
  changes or forced version upgrades. Root operates the Root Image Catalog (cr.root.io), Library Catalog,
  and OS-package registry (pkg.root.io), and exposes a REST API (api.root.io) for querying patch status,
  security findings, subscriptions, and pulling SBOM, VEX, and provenance artifacts, plus Standard-Webhooks
  notifications and a first-party CLI (rootio_patcher).
